name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tanda, POSTGRES_PASSWORD: tanda_ci_pw, POSTGRES_DB: tanda_tambah }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tanda" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://tanda:tanda_ci_pw@localhost:5432/tanda_tambah
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
      ADMIN_PASSWORD: CiAdmin12345!
      LOGIN_RATE_LIMIT_MAX: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install Python dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Backend tests (pytest, database tanda_tambah_test)
        working-directory: apps/api
        env: { DATABASE_URL: "postgresql+psycopg://tanda:tanda_ci_pw@localhost:5432/tanda_tambah_test" }
        run: python -m pytest -q tests
      - name: Migrate & seed
        working-directory: apps/api
        run: alembic upgrade head && python -m app.seed
      - name: Install web dependencies, type-check & build
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build:web
      - name: Start API & web
        run: |
          (cd apps/api && STORAGE_DIR=/tmp/storage nohup uvicorn app.main:app --port 4000 > ../../api.log 2>&1 &)
          (cd apps/web && nohup npx next start -p 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:4000/api/v1/health http://localhost:3000/login
      - name: Install Playwright browser
        run: pnpm --filter @tanda/web exec playwright install --with-deps chromium
      - name: Web end-to-end tests
        run: pnpm test:e2e:web
        env: { E2E_ADMIN_PASSWORD: CiAdmin12345! }
      - name: Secret scan (no credentials committed)
        run: |
          ! git grep -nE "(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|\"private_key\":|ghp_[A-Za-z0-9]{30,})" -- ':!*.md'
      - if: failure()
        run: tail -n 200 api.log web.log || true

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/api.Dockerfile -t tanda-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t tanda-web .
