# Tanda Tambah – backend Python (FastAPI) + frontend Next.js + PostgreSQL.
# Salin .env.example menjadi .env dan isi semua CHANGE_ME dulu, lalu:
#   docker compose up -d --build                 # db, migrate (alembic + seed), api, web
#   docker compose --profile https up -d         # + Caddy (HTTPS otomatis untuk domain Anda)
name: tanda-tambah
x-db-url: &db-url postgresql+psycopg://${POSTGRES_USER:-tanda}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tanda_tambah}

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    # 4 proses API × 15 koneksi = 60; sisakan ruang untuk migrasi, backup, dan admin
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tanda_tambah}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tanda}"], interval: 10s, retries: 10 }

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      DATABASE_URL: *db-url
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    restart: "no"

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      APP_ENV: production
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WEB_CONCURRENCY: ${API_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    volumes: [photos:/data/storage]
    expose: ["4000"]

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    # Hanya localhost: di server, akses publik lewat Caddy (HTTPS). Docker melewati firewall, jadi jangan buka 0.0.0.0.
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"]

  proxy:
    profiles: ["https"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment: { SITE_DOMAIN: "${SITE_DOMAIN:-localhost}" }
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes: { pgdata: {}, photos: {}, caddydata: {} }
